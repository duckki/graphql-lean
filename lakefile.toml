name = "graphql-lean"
version = "0.1.0"
defaultTargets = ["GraphQL", "Proofs", "Tests"]
lintDriver = "lint"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "v0.3.4"

[[lean_lib]]
name = "GraphQL"

[[lean_lib]]
name = "Proofs"

[[lean_lib]]
name = "Tests"

[[lean_lib]]
name = "Lint.ImportClosure"

[[lean_exe]]
name = "lint"
root = "Lint"

[[lean_exe]]
name = "import-closure"
root = "Lint.ImportClosureMain"

[[lean_exe]]
name = "query-inclusion-bench"
root = "Benchmarks.QueryInclusion"
